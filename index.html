<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>產品發表過三關 - 拓展練習</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f1f8e9;
            --box-bg: #fffde7;
            --border-color: #c5e1a5;
            --text-main: #5d4037;
            --btn-green: #81c784;
            --btn-wrong: #e57373;
            --ac-orange: #ffb74d;
        }

        * { box-sizing: border-box; font-family: 'Zen Maru Gothic', sans-serif; color: var(--text-main); }
        
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#dcedc8 2px, transparent 2px);
            background-size: 30px 30px;
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%; max-width: 600px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 24px; padding: 20px;
            box-shadow: 0 8px 16px rgba(139, 195, 74, 0.2);
            display: none;
        }

        .active-screen { display: block; animation: fadeIn 0.4s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1, h2, h3 { text-align: center; color: #7cb342; text-shadow: 1px 1px 0px #fff; }
        
        input[type="text"] {
            width: 100%; padding: 12px; border: 3px solid var(--border-color);
            border-radius: 12px; font-size: 1.1rem; text-align: center; outline: none; margin-bottom: 10px;
        }
        input[type="text"]:focus { border-color: var(--btn-green); }

        .btn {
            background: var(--btn-green); color: #fff; border: none;
            border-radius: 16px; padding: 12px 24px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 0 #66bb6a; transition: all 0.1s;
            margin-top: 5px;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }
        .btn:disabled { cursor: not-allowed; opacity: 0.6; box-shadow: none !important; transform: translateY(4px); }
        
        .level-grid { display: flex; flex-direction: column; gap: 15px; }
        .level-card {
            background: #fff; border: 4px solid var(--border-color); border-radius: 20px;
            padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer;
            transition: transform 0.2s;
        }
        .level-card:hover { transform: scale(1.02); }
        .level-card img { width: 100px; height: 100px; border-radius: 12px; object-fit: cover; border: 2px solid #eee; }
        .level-info { flex-grow: 1; }
        .level-score { font-weight: bold; color: #f57c00; font-size: 1.1rem; }

        video { width: 100%; border-radius: 16px; border: 4px solid #aed581; margin-bottom: 15px; background: #000; }
        .dialog-box {
            background: var(--box-bg); border: 4px solid var(--border-color);
            border-radius: 20px; padding: 20px; position: relative;
        }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        .option-btn {
            background: #fff; border: 2px solid #aed581; border-radius: 12px;
            padding: 12px; font-size: 1rem; text-align: left; cursor: pointer; font-weight: 500; transition: 0.2s;
        }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
        .option-btn.correct { background: var(--btn-green); color: #fff; border-color: var(--btn-green); }
        .option-btn.wrong { background: var(--btn-wrong); color: #fff; border-color: var(--btn-wrong); }
        
        .action-dots { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .dot-btn {
            width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
            font-size: 1.2rem; box-shadow: 0 4px 0 rgba(0,0,0,0.1); display: none;
        }
        .dot-btn:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); }
        .dot-red { background: #ff5252; color: white; display: flex; align-items: center; justify-content: center;}
        .dot-blue { background: #448aff; color: white; display: flex; align-items: center; justify-content: center; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: var(--box-bg); border: 4px solid var(--ac-orange); border-radius: 20px;
            padding: 25px; width: 85%; max-width: 400px; text-align: center; max-height: 90vh; overflow-y: auto;
        }

        #cert-area { text-align: center; padding: 20px; background: #fff; border: 5px dashed #aed581; border-radius: 20px; margin-bottom: 20px;}
        .total-score { font-size: 3rem; color: #ff9800; font-weight: bold; margin: 10px 0; }
        
        .hint-btn { background: #ffb74d; box-shadow: 0 4px 0 #f57c00; margin-left: 10px; }
        .btn-group { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
        .top-bar .btn { margin-top: 0; padding: 8px 15px; font-size: 1rem; flex: 1; }
    </style>
</head>
<body>

<!-- 1. 登入畫面 -->
<div id="screen-login" class="container active-screen" style="text-align: center;">
    <img src="https://api.iconify.design/twemoji:leaf.svg" width="60" alt="leaf">
    <h1>產品發表過三關</h1>
    <p>請輸入你的姓名開始挑戰！</p>
    <input type="text" id="player-name" placeholder="你的姓名...">
    <br>
    <button class="btn" onclick="startGame()">進入無人島 ✈️</button>
</div>

<!-- 2. 關卡選擇畫面 -->
<div id="screen-levels" class="container">
    <h2>🏝️ 選擇你要挑戰的關卡</h2>
    <p style="text-align:center;">你好，<span id="display-name" style="font-weight:bold; color:#f57c00;"></span>！</p>
    <div class="level-grid">
        <div class="level-card" onclick="enterLevel('fan')">
            <img src="P1.jpg" alt="便攜風扇" onerror="this.src='https://via.placeholder.com/100?text=P1'">
            <div class="level-info">
                <h3>第一關：便攜風扇</h3>
                <div class="level-score">最高分數: <span id="score-fan">0</span> / 10</div>
            </div>
        </div>
        <div class="level-card" onclick="enterLevel('watch')">
            <img src="P2.jpg" alt="智能運動手錶" onerror="this.src='https://via.placeholder.com/100?text=P2'">
            <div class="level-info">
                <h3>第二關：智能手錶</h3>
                <div class="level-score">最高分數: <span id="score-watch">0</span> / 20</div>
            </div>
        </div>
        <div class="level-card" onclick="enterLevel('phone')">
            <img src="P3.jpg" alt="智能摺疊手機" onerror="this.src='https://via.placeholder.com/100?text=P3'">
            <div class="level-info">
                <h3>第三關：摺疊手機</h3>
                <div class="level-score">最高分數: <span id="score-phone">0</span> / 24</div>
            </div>
        </div>
        <!-- 第四關：雙門冰箱 -->
        <div class="level-card" onclick="enterLevel('fridge')">
            <img src="P4.jpg" alt="雙門冰箱" onerror="this.src='https://via.placeholder.com/100?text=P4'">
            <div class="level-info">
                <h3>第四關：雙門冰箱</h3>
                <div class="level-score">最高分數: <span id="score-fridge">0</span> / 18</div>
            </div>
        </div>
    </div>
    <div style="text-align:center; margin-top:20px;">
        <button class="btn" style="background:#ff9800; box-shadow:0 4px 0 #f57c00; width: 100%;" onclick="showFinalResult()">🏆 結算總分與下載證書</button>
    </div>
</div>

<!-- 3. 遊戲畫面 -->
<div id="screen-game" class="container">
    <div class="top-bar">
        <button class="btn" style="background:#ccc; box-shadow: 0 4px 0 #999;" onclick="goBackToLevels()">⬅ 返回目錄</button>
        <button class="btn" style="background:#4fc3f7; box-shadow: 0 4px 0 #0288d1;" onclick="retryCurrentLevel()">🔄 重新挑戰</button>
    </div>
    
    <video id="game-video" controls playsinline preload="metadata">
        你的瀏覽器不支援 HTML5 影片播放。
    </video>
    
    <div class="dialog-box" id="question-box">
        <div id="q-title" style="font-weight:bold; color:#7cb342; margin-bottom:10px;"></div>
        <div id="q-text" style="font-size:1.1rem; line-height:1.6;"></div>
        
        <!-- 選擇題區塊 -->
        <div id="mcq-area" class="options-container"></div>
        
        <!-- 填空題區塊 -->
        <div id="fill-area" style="display:none; text-align:center; margin-top:15px;">
            <input type="text" id="fill-input" placeholder="請輸入答案...">
            <div class="btn-group">
                <button class="btn" id="submit-fill-btn" onclick="checkFillAnswer()">提交答案</button>
                <button class="btn hint-btn" id="hint-btn" onclick="useHint()">💡 提示(扣1分)</button>
            </div>
        </div>

        <div class="action-dots">
            <button class="dot-btn dot-red" id="dot-red" onclick="showRedDot()">🔴</button>
            <button class="dot-btn dot-blue" id="dot-blue" onclick="showBlueDot()">🔵</button>
        </div>

        <button class="btn" id="next-btn" style="width:100%; display:none; background:#29b6f6; box-shadow:0 4px 0 #0288d1; margin-top: 15px;" onclick="nextQuestion()">下一題 ➔</button>
    </div>
</div>

<!-- 4. 結算畫面 -->
<div id="screen-result" class="container">
    <div id="cert-area">
        <img src="https://api.iconify.design/twemoji:party-popper.svg" width="50" alt="慶祝">
        <h2>拓展練習結業證書</h2>
        <p>學員：<strong id="cert-name" style="font-size:1.2rem;"></strong></p>
        <p>你在本次挑戰中獲得了總分：</p>
        <div class="total-score" id="cert-score">0</div>
        <p style="color:#888; margin-bottom: 5px;">太棒了！你已經掌握了產品發表的技巧！</p>
        
        <!-- 動態生成的填空紀錄區 -->
        <div id="cert-answers" style="margin-top: 15px; border-top: 2px dashed #c5e1a5; padding-top: 15px; text-align: left;">
            <!-- JS 將在這裡插入紀錄 -->
        </div>
    </div>
    <button class="btn" style="width:100%; margin-bottom: 10px;" onclick="downloadScreenshot()">📸 下載成績截圖</button>
    <button class="btn" style="width:100%; background:#ccc; box-shadow:0 4px 0 #999;" onclick="location.reload()">退出遊戲</button>
</div>

<!-- 彈窗 -->
<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <h3 id="modal-title"></h3>
        <p id="modal-text" style="text-align:left; line-height:1.6;"></p>
        <button class="btn" onclick="document.getElementById('modal').style.display='none'">我知道了</button>
    </div>
</div>

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    if (type === 'click') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'correct') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

function switchScreen(screenId) {
    document.querySelectorAll('.container').forEach(c => c.classList.remove('active-screen'));
    document.getElementById(screenId).classList.add('active-screen');
}

function startGame() {
    playSound('click');
    const nameInput = document.getElementById('player-name').value.trim();
    if (!nameInput) { alert("請輸入姓名！"); return; }
    playerName = nameInput;
    document.getElementById('display-name').textContent = playerName;
    switchScreen('screen-levels');
}

function enterLevel(levelId) {
    playSound('click');
    currentLevelId = levelId;
    currentQIndex = 0;
    currentScore = 0; 
    
    // 進入新關卡或重玩時，清空當前關卡的填充紀錄，確保只有最新一次的成績被匯出
    userFillRecords[currentLevelId] = {}; 

    const video = document.getElementById('game-video');
    video.src = levelData[levelId].video;
    
    video.onerror = function() {
        console.error("無法載入影片:", video.src);
        alert(`無法載入影片檔案 ${levelData[levelId].video}！\n請確保 HTML 檔案與影片檔案存放在同一個資料夾，並且檔名大小寫完全一致。`);
    };

    video.load();
    switchScreen('screen-game');
    loadQuestion();
}

function retryCurrentLevel() {
    if (confirm("確定要重新挑戰本關嗎？目前本關的分數與作答紀錄將會重置。")) {
        playSound('click');
        enterLevel(currentLevelId);
    }
}

function goBackToLevels() {
    playSound('click');
    document.getElementById('game-video').pause();
    if(currentScore > scores[currentLevelId]) {
        scores[currentLevelId] = currentScore;
        document.getElementById(`score-${currentLevelId}`).textContent = scores[currentLevelId];
    }
    switchScreen('screen-levels');
}

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function loadQuestion() {
    const q = levelData[currentLevelId].questions[currentQIndex];
    mcqWrongCount = 0;
    hintUsed = false;  
    
    document.getElementById('q-title').textContent = `第 ${currentQIndex + 1} 題 (${q.type === 'mcq' ? '選擇題 2分' : '填空題 4分'})`;
    document.getElementById('q-text').innerHTML = q.text.replace('___', '<span style="display:inline-block; width:100px; border-bottom:2px solid #5d4037;"></span>');
    
    document.getElementById('dot-red').style.display = 'none'; 
    document.getElementById('next-btn').style.display = 'none'; 

    if (q.type === 'mcq') {
        document.getElementById('mcq-area').style.display = 'flex';
        document.getElementById('fill-area').style.display = 'none';
        
        const mcqArea = document.getElementById('mcq-area');
        mcqArea.innerHTML = '';
        const shuffledOpts = shuffle([...q.opts]);
        
        shuffledOpts.forEach(optObj => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = optObj.text;
            btn.onclick = () => handleMCQ(btn, optObj, q);
            mcqArea.appendChild(btn);
        });
    } else {
        document.getElementById('mcq-area').style.display = 'none';
        document.getElementById('fill-area').style.display = 'block';
        document.getElementById('fill-input').value = '';
        document.getElementById('hint-btn').disabled = false;
        document.getElementById('submit-fill-btn').disabled = false;
    }
}

function handleMCQ(btn, selectedOptObj, q) {
    if (selectedOptObj.isCorrect) {
        playSound('correct');
        btn.classList.add('correct');
        currentScore += 2;
        
        document.getElementById('q-text').innerHTML = q.text.replace('___', `<span style="color:var(--btn-green); font-weight:bold; border-bottom:2px solid var(--btn-green); padding: 0 5px;">${q.ans}</span>`);
        document.getElementById('dot-red').style.display = 'flex';
        
        const btns = document.getElementById('mcq-area').querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);
        document.getElementById('next-btn').style.display = 'block';
    } else {
        playSound('wrong');
        btn.classList.add('wrong');
        btn.disabled = true; 
        currentScore -= 1;
        mcqWrongCount++;
        
        if (mcqWrongCount < 2) {
            showModal("❌ 答錯了 (扣1分)", `${selectedOptObj.feedback}<br><br>💡 你還有 1 次機會，請再試一次！`);
        } else {
            showModal("❌ 答錯兩次 (共扣2分)", `${selectedOptObj.feedback}<br><br>正確答案是：<strong>${q.ans}</strong>`);
            const btns = document.getElementById('mcq-area').querySelectorAll('.option-btn');
            btns.forEach(b => {
                b.disabled = true;
                if(b.textContent === q.ans) b.classList.add('correct');
            });
            document.getElementById('q-text').innerHTML = q.text.replace('___', `<span style="color:var(--btn-wrong); font-weight:bold; border-bottom:2px solid var(--btn-wrong); padding: 0 5px;">${q.ans}</span>`);
            document.getElementById('next-btn').style.display = 'block';
        }
    }
}

function useHint() {
    if (hintUsed) return;
    playSound('click');
    hintUsed = true;
    currentScore -= 1;
    const q = levelData[currentLevelId].questions[currentQIndex];
    document.getElementById('hint-btn').disabled = true;
    showModal("💡 提示 (已扣1分)", q.hint);
}

function checkFillAnswer() {
    const q = levelData[currentLevelId].questions[currentQIndex];
    const input = document.getElementById('fill-input').value.trim();
    if (!input) { alert("請輸入答案！"); return; }
    
    document.getElementById('submit-fill-btn').disabled = true;
    document.getElementById('hint-btn').disabled = true; 
    
    let isCorrect = q.keys.some(key => input.includes(key));
    
    // 記錄學生的填充答案，用於老師檢查 (綠色底線表示達標，紅色底線表示未達標)
    const formattedInput = `<span style="color:${isCorrect ? '#2e7d32' : '#c62828'}; text-decoration:underline; font-weight:bold;">${input}</span>`;
    userFillRecords[currentLevelId][currentQIndex] = q.text.replace('___', formattedInput);
    
    if (isCorrect) {
        playSound('correct');
        currentScore += 4; 
        showModal("✅ 答對了 (獲4分)", `你的答案很棒！<br><br><strong>參考標準答案：</strong><br>${q.ans}`);
        document.getElementById('dot-red').style.display = 'flex';
        document.getElementById('q-text').innerHTML = q.text.replace('___', `<span style="color:var(--btn-green); font-weight:bold; border-bottom:2px solid var(--btn-green); padding: 0 5px;">${input}</span>`);
    } else {
        playSound('wrong');
        currentScore -= 1;
        showModal("❌ 語意未達標 (扣1分)", `你的答案可能偏離了重點。<br><br><strong>參考標準答案：</strong><br>${q.ans}<br><br><strong>其他合理方向：</strong><br>${q.alts}`);
        document.getElementById('q-text').innerHTML = q.text.replace('___', `<span style="color:var(--btn-wrong); font-weight:bold; border-bottom:2px solid var(--btn-wrong); padding: 0 5px;">${q.ans}</span>`);
    }
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    playSound('click');
    currentQIndex++;
    if (currentQIndex < levelData[currentLevelId].questions.length) {
        loadQuestion();
    } else {
        showModal("🎉 關卡完成！", `恭喜完成本關卡！<br>你在本關獲得了 ${currentScore} 分。<br><br>點擊「我知道了」返回目錄，或者可以使用上方按鈕重新挑戰！`);
        goBackToLevels();
    }
}

function showRedDot() {
    playSound('click');
    const q = levelData[currentLevelId].questions[currentQIndex];
    showModal('📖 參考答案與拓展', `<strong>標準答案：</strong><br><span style="color:#e57373;">${q.ans}</span><br><br><strong>${q.alts}</strong>`);
}

function showBlueDot() {
    playSound('click');
    const q = levelData[currentLevelId].questions[currentQIndex];
    showModal('💡 表達技巧', `(${q.tech})`);
}

function showModal(title, text) {
    document.getElementById('modal-title').innerHTML = title;
    document.getElementById('modal-text').innerHTML = text;
    document.getElementById('modal').style.display = 'flex';
}

function showFinalResult() {
    playSound('correct');
    const total = scores.fan + scores.watch + scores.phone + scores.fridge;
    document.getElementById('cert-name').textContent = playerName;
    document.getElementById('cert-score').textContent = total;
    
    // 生成老師檢查用的填充紀錄列表
    const answersContainer = document.getElementById('cert-answers');
    answersContainer.innerHTML = '<h3 style="color:#7cb342; margin-top:0;">📝 學生填充題作答紀錄</h3>';
    let hasAnswers = false;

    // 依序渲染每個關卡的紀錄
    const levelOrder = ['fan', 'watch', 'phone', 'fridge'];
    levelOrder.forEach(lvl => {
        const records = userFillRecords[lvl];
        if (records && Object.keys(records).length > 0) {
            hasAnswers = true;
            let html = `<div style="margin-bottom:15px;">
                            <h4 style="margin:5px 0; color:#5d4037; font-size:1.1rem;">▪ ${levelData[lvl].title}</h4>
                            <ul style="margin:0; padding-left:20px; font-size:1rem; color:#424242;">`;
            for (const qIdx in records) {
                html += `<li style="margin-bottom:8px; line-height:1.5;">${records[qIdx]}</li>`;
            }
            html += `</ul></div>`;
            answersContainer.innerHTML += html;
        }
    });

    if (!hasAnswers) {
        answersContainer.innerHTML += '<p style="color:#888;">尚未作答任何填充題。</p>';
    }

    switchScreen('screen-result');
}

function downloadScreenshot() {
    playSound('click');
    const certArea = document.getElementById('cert-area');
    
    // 短暫修改樣式以確保截圖能完整拍下長內容
    const originalMaxHeight = certArea.style.maxHeight;
    certArea.style.maxHeight = 'none'; 
    
    html2canvas(certArea, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${playerName}_產品發表過三關_含作答紀錄.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        // 恢復原本樣式
        certArea.style.maxHeight = originalMaxHeight;
    });
}
</script>
